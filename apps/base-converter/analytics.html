<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学習の分析 | student-tool</title>
  <meta name="description" content="進数変換の通算初回成績と変換別の苦手分析。">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header"><a class="brand" href="index.html">student-tool</a><span>基本情報 技術分野の補助ツール</span></header>
  <main class="container">
    <a class="back-link" href="index.html">← 変換を選ぶ画面へ戻る</a>
    <section class="analytics-hero" aria-labelledby="analytics-title">
      <p class="eyebrow">このブラウザの学習記録</p>
      <h1 id="analytics-title">学習の<span>分析</span></h1>
      <p>復習の結果を混ぜず、最初に解いた問題だけで苦手な変換を見ます。</p>
    </section>
    <section class="achievement-panel" aria-labelledby="achievement-title">
      <h2 id="achievement-title">積み上げた成果</h2>
      <div id="achievement-cards" class="achievement-cards" aria-live="polite"></div>
    </section>
    <section class="analysis-panel" aria-labelledby="direction-title">
      <h2 id="direction-title">変換ごとの初回正解率</h2>
      <p class="panel-note">低い項目ほど、次の10問で重点的に練習する目安です。</p>
      <div id="direction-chart" class="bar-chart" aria-live="polite"></div>
    </section>
  </main>
  <footer>student-tool · 回答データはブラウザ外へ送信しません</footer>
  <script type="module" src="analytics.js"></script>
</body>
</html>
