<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>進数変換問題 | student-tool</title>
  <meta name="description" content="基本情報技術者試験の数値表現を練習する進数変換問題。">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">student-tool</a>
    <span>基本情報 技術分野の補助ツール</span>
  </header>
  <main class="container quiz-page">
    <nav aria-label="ページ移動"><a class="back-link" href="index.html">← 変換を選ぶ画面へ戻る</a></nav>
    <section class="quiz-section" aria-labelledby="quiz-title">
      <div class="section-heading">
        <div>
          <h1 id="quiz-title">進数変換</h1>
        </div>
        <button id="new-quiz" class="button secondary" type="button">新しい問題にする</button>
      </div>
      <form id="quiz-form" novalidate>
        <div id="questions" class="questions" aria-live="polite"></div>
        <div class="submit-row">
          <button id="grade-quiz" class="button primary" type="submit">採点して解説を見る</button>
          <p id="form-message" class="form-message" role="alert"></p>
        </div>
      </form>
      <section id="result" class="result" hidden aria-live="polite"></section>
    </section>
  </main>
  <footer class="tool-footer">
    <nav class="tool-links" aria-label="おすすめの学習ツール">
      <span class="tool-links-label">おすすめの学習ツール</span>
      <a href="https://iot-typing-game.vercel.app/"><img class="tool-icon" src="https://iot-typing-game.vercel.app/favicon.svg" alt=""><strong>IoTタイピングゲーム</strong><b aria-hidden="true">→</b></a>
    </nav>
  </footer>
  <script type="module" src="quiz.js"></script>
</body>
</html>
