<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>進数変換 10問チャレンジ | student-tool</title>
  <meta name="description" content="基本情報技術者試験の数値表現を練習する、2進数・10進数・16進数の10問問題。">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top">student-tool</a>
    <span>基本情報 技術分野の補助ツール</span>
  </header>
  <main id="top" class="container">
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">基礎理論 / 数値表現</p>
      <h1 id="page-title">進数変換<br><span>10問チャレンジ</span></h1>
      <p>変換の方向を選び、同じ種類の問題を10問まとめて練習します。</p>
    </section>

    <section class="settings" aria-labelledby="settings-title">
      <div>
        <p class="eyebrow">出題メニュー</p>
        <h2 id="settings-title">変換を選ぶ</h2>
      </div>
      <label for="conversion-menu">10問すべてに出す変換</label>
      <select id="conversion-menu" name="conversion-menu"></select>
      <p>選んだ変換だけを、4・8・12ビットの範囲で10問出題します。</p>
    </section>

    <section class="quiz-section" aria-labelledby="quiz-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">選択中の出題</p>
          <h2 id="quiz-title">2進数 → 10進数</h2>
        </div>
        <button id="new-quiz" class="button secondary" type="button">この変換で10問出す</button>
      </div>
      <form id="quiz-form" novalidate>
        <div id="questions" class="questions" aria-live="polite"></div>
        <div class="submit-row">
          <button id="grade-quiz" class="button primary" type="submit">10問を採点する</button>
          <p id="form-message" class="form-message" role="alert"></p>
        </div>
      </form>
      <section id="result" class="result" hidden aria-live="polite"></section>
    </section>
  </main>
  <footer>student-tool · 回答データはブラウザ外へ送信しません</footer>
  <script type="module" src="app.js"></script>
</body>
</html>
