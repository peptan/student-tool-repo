<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>進数変換 10問チャレンジ | student-tool</title>
  <meta name="description" content="基本情報技術者試験の数値表現を練習する、進数変換問題。">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">student-tool</a>
    <span>基本情報 技術分野の補助ツール</span>
  </header>
  <main class="container menu-page">
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">基礎理論 / 数値表現</p>
      <h1 id="page-title">進数変換<br><span>10問チャレンジ</span></h1>
      <p>練習したい変換を選ぶと、その変換だけの問題を10問出します。</p>
    </section>

    <section class="menu-section" aria-labelledby="menu-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">出題メニュー</p>
          <h2 id="menu-title">変換を選ぶ</h2>
        </div>
      </div>
      <div id="conversion-cards" class="conversion-cards" aria-live="polite"></div>
    </section>

    <section class="progress-section" aria-labelledby="progress-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">このブラウザの学習記録</p>
          <h2 id="progress-title">学習記録</h2>
        </div>
        <a class="button secondary" href="analytics.html">学習の分析を見る</a>
        <button id="clear-progress" class="button danger" type="button">学習記録を消去</button>
      </div>
      <p id="progress-summary" class="progress-summary">問題を解くと、正解数と正解率を記録します。</p>
      <div id="progress-list" class="progress-list"></div>
      <p class="privacy-note">正解数と解答数だけを、この端末のブラウザに保存します。外部へ送信しません。</p>
    </section>
  </main>
  <footer>student-tool · 回答データはブラウザ外へ送信しません</footer>
  <script type="module" src="menu.js"></script>
</body>
</html>
